[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Rua"
version = "0.1.0"
description = "Tools for creating stellar evolution diagrams for binary systems"
readme = "README.md"
authors = [
    {name = "Max Briel", email = "max.briel@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = ["astronomy", "stellar-evolution", "visualization", "wolf-rayet"]

dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/binary-diagrams"
Documentation = "https://github.com/yourusername/binary-diagrams#readme"
Repository = "https://github.com/yourusername/binary-diagrams"

[project.scripts]
create-binary-diagram = "binary_diagrams.cli:main_binary"
create-single-star-diagram = "binary_diagrams.cli:main_single"

[tool.setuptools]
packages = ["binary_diagrams"]

[tool.setuptools.package-data]
binary_diagrams = ["*.png", "*.jpg", "*.jpeg"]
